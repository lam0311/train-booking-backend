openapi: 3.0.0
info:
  title: API Hệ thống Đặt Vé Tàu Hỏa
  version: 1.0.0
  description: >-
    API backend cho đăng ký và xác thực người dùng, tra cứu ghế, đặt vé,
    xem chi tiết vé và hủy vé. Swagger UI được phục vụ tại /api-docs.
  contact:
    name: Nhóm phát triển Train Booking
  license:
    name: ISC
    url: https://opensource.org/license/isc-license-txt

servers:
  - url: http://localhost:5000
    description: Server phát triển cục bộ (Local)
  - url: https://train-booking-backend-3ri7.onrender.com
    description: Server Production (Render)
  - url: /
    description: Server hiện tại (Relative URL)

tags:
  - name: Sức khỏe hệ thống
    description: Kiểm tra server có đang hoạt động.
  - name: Xác thực
    description: Đăng ký, đăng nhập, làm mới access token và đăng xuất.
  - name: Ghế
    description: Tra cứu tình trạng ghế theo chuyến tàu và chặng đường.
  - name: Vé
    description: Đặt vé, xem chi tiết vé và hủy vé.

paths:
  /health/live:
    get:
      operationId: getHealthStatus
      tags:
        - Sức khỏe hệ thống
      summary: Kiểm tra trạng thái hoạt động của server
      description: Endpoint công khai, không yêu cầu xác thực.
      security: []
      responses:
        "200":
          description: Server đang hoạt động.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                status: ok
        "429":
          $ref: "#/components/responses/GlobalRateLimited"

  /api/v1/auth/register:
    post:
      operationId: registerUser
      tags:
        - Xác thực
      summary: Đăng ký tài khoản mới
      description: >-
        Tạo tài khoản mới. Email được Mongoose trim và chuyển thành chữ thường.
        Endpoint bị giới hạn 20 request mỗi phút trên mỗi IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: nguyenvana@gmail.com
              password: SecurePass123!
      responses:
        "201":
          description: Đăng ký thành công.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
              example:
                data:
                  userId: "66f57871b69f64a132fae201"
                  email: nguyenvana@gmail.com
        "409":
          description: Email đã được sử dụng.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: EMAIL_TAKEN
                  message: Email này đã được sử dụng
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/auth/login:
    post:
      operationId: loginUser
      tags:
        - Xác thực
      summary: Đăng nhập và nhận access token, refresh token
      description: >-
        Xác thực bằng email và mật khẩu. Access token mặc định sống 15 phút,
        refresh token mặc định sống 7 ngày. Endpoint bị giới hạn 20 request mỗi phút trên mỗi IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: nguyenvana@gmail.com
              password: SecurePass123!
      responses:
        "200":
          description: Đăng nhập thành công.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                data:
                  accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example-access-token"
                  refreshToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example-refresh-token"
        "401":
          description: Email hoặc mật khẩu không đúng.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: INVALID
                  message: Email hoặc mật khẩu không đúng!
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/auth/refresh:
    post:
      operationId: refreshAccessToken
      tags:
        - Xác thực
      summary: Làm mới access token
      description: >-
        Dùng refresh token trong body để tạo access token mới. Endpoint này không yêu cầu
        header Authorization, nhưng bị giới hạn 20 request mỗi phút trên mỗi IP.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
            example:
              refreshToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example-refresh-token"
      responses:
        "200":
          description: Làm mới access token thành công.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RefreshResponse"
              example:
                data:
                  accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.new-access-token"
        "401":
          description: Không có refresh token, token không hợp lệ, hết hạn hoặc không khớp phiên hiện tại.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missingRefreshToken:
                  value:
                    error:
                      code: NO_REFRESH_TOKEN
                      message: Không có refresh token!
                invalidRefreshToken:
                  value:
                    error:
                      code: INVALID_REFRESH_TOKEN
                      message: Refresh token không hợp lệ hoặc đã hết hạn!
                tokenMismatch:
                  value:
                    error:
                      code: REFRESH_TOKEN_MISMATCH
                      message: Refresh token không hợp lệ!
        "429":
          $ref: "#/components/responses/AuthRateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/auth/logout:
    post:
      operationId: logoutUser
      tags:
        - Xác thực
      summary: Đăng xuất bằng refresh token
      description: >-
        Xóa refresh token nếu token còn hợp lệ. Endpoint công khai; không cần Bearer access token.
        Refresh token không hợp lệ vẫn nhận response 200 để việc đăng xuất có tính idempotent.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
            example:
              refreshToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example-refresh-token"
      responses:
        "200":
          description: Đăng xuất thành công hoặc refresh token đã không còn hợp lệ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogoutResponse"
              examples:
                successfulLogout:
                  value:
                    data:
                      message: Đã đăng xuất thành công!
                alreadyInvalidToken:
                  value:
                    data:
                      message: Đã đăng xuất!
        "400":
          description: Request không có refresh token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: NO_REFRESH_TOKEN
                  message: Không có refresh token!
        "429":
          $ref: "#/components/responses/GlobalRateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/trips/{tripId}/seats:
    get:
      operationId: getTripSeats
      tags:
        - Ghế
      summary: Tra cứu tình trạng ghế theo chặng
      description: >-
        Trả về trạng thái có thể đặt của mọi ghế trong chuyến tàu tại chặng được yêu cầu.
        `from` và `to` là tùy chọn; khi không truyền, backend dùng mặc định from=0 và to=4.
      security: []
      parameters:
        - $ref: "#/components/parameters/TripId"
        - name: from
          in: query
          required: false
          description: Chỉ số ga xuất phát, từ 0 đến 3. Mặc định là 0.
          schema:
            type: integer
            minimum: 0
            maximum: 3
            default: 0
          example: 0
        - name: to
          in: query
          required: false
          description: Chỉ số ga đến, từ 1 đến 4 và phải lớn hơn from. Mặc định là 4.
          schema:
            type: integer
            minimum: 1
            maximum: 4
            default: 4
          example: 4
      responses:
        "200":
          description: Tra cứu ghế thành công.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetSeatsResponse"
              example:
                data:
                  tripId: SE1-2026
                  fromIndex: 0
                  toIndex: 4
                  requestedMask: 15
                  seats:
                    - seatNumber: 1
                      available: true
                    - seatNumber: 2
                      available: false
        "400":
          description: Query parameter không hợp lệ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: VALIDATION_ERROR
                  message: to phải lớn hơn from
        "429":
          $ref: "#/components/responses/GlobalRateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/bookings:
    post:
      operationId: createBooking
      tags:
        - Vé
      summary: Đặt vé tàu mới
      description: >-
        Đặt một ghế cho chặng được chọn. Ghế chỉ được đặt thành công nếu toàn bộ đoạn đường
        cần dùng chưa bị một allocation khác chiếm. Yêu cầu access token JWT.
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          description: >-
            Khóa định danh duy nhất (UUID v4) cho yêu cầu đặt vé. Dùng để đảm bảo tính Idempotency, 
            tránh việc bị đặt vé hoặc trừ tiền trùng lặp khi mạng chập chờn / client retry.
          schema:
            type: string
            example: "9b1deb4d-3b7d-4bad-9bdd-2b0d7b3dcb6d"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
            example:
              tripId: SE1-2026
              seatNumber: 5
              fromIndex: 0
              toIndex: 2
      responses:
        "201":
          description: Đặt vé thành công.
          headers:
            Idempotency-Replayed:
              description: Trả về "true" nếu đơn đặt vé này được replay từ giao dịch trước đó có cùng Idempotency-Key.
              schema:
                type: string
                example: "true"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateBookingResponse"
              example:
                data:
                  bookingId: "d7a3b8f2-9c1e-4f6a-b2d5-8e3c7a9f1d4b"
                  tripId: SE1-2026
                  seatNumber: 5
                  fromIndex: 0
                  toIndex: 2
                  segmentMask: 3
                  status: CONFIRMED
        "400":
          description: Request body không hợp lệ.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: VALIDATION_ERROR
                  message: toIndex phải lớn hơn fromIndex
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Ghế không tồn tại hoặc đã bị đặt trong chặng đường được yêu cầu.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: SEGMENT_CONFLICT
                  message: Ghế số 5 đã có người đặt ở chặng này hoặc không tồn tại!
        "429":
          $ref: "#/components/responses/GlobalRateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/bookings/{bookingId}:
    get:
      operationId: getBookingById
      tags:
        - Vé
      summary: Xem chi tiết vé theo mã vé
      description: Chỉ chủ sở hữu của vé mới xem được thông tin chi tiết. Yêu cầu access token JWT.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: Truy vấn vé thành công.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingDetailResponse"
              example:
                data:
                  bookingId: "d7a3b8f2-9c1e-4f6a-b2d5-8e3c7a9f1d4b"
                  tripId: SE1-2026
                  seatNumber: 5
                  fromIndex: 0
                  toIndex: 2
                  segmentMask: 3
                  createdAt: "2026-10-05T10:30:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Vé không tồn tại hoặc không thuộc về người dùng hiện tại.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: NOT_FOUND
                  message: Vé không tồn tại hoặc bạn không có quyền xem vé này!
        "429":
          $ref: "#/components/responses/GlobalRateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

    delete:
      operationId: cancelBookingById
      tags:
        - Vé
      summary: Hủy vé và giải phóng ghế
      description: Chỉ chủ sở hữu của vé mới hủy được. Yêu cầu access token JWT.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/BookingId"
      responses:
        "200":
          description: Hủy vé thành công.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteBookingResponse"
              example:
                data:
                  bookingId: "d7a3b8f2-9c1e-4f6a-b2d5-8e3c7a9f1d4b"
                  message: Đã hủy vé thành công!
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Vé không tồn tại hoặc không thuộc về người dùng hiện tại.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: NOT_FOUND
                  message: Vé không tồn tại hoặc bạn không có quyền hủy vé này!
        "409":
          description: Hủy vé thất bại.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: DELETE_FAILED
                  message: Hủy vé thất bại, vui lòng thử lại!
        "429":
          $ref: "#/components/responses/GlobalRateLimited"
        "500":
          $ref: "#/components/responses/InternalServerError"

components:

  parameters:
    TripId:
      name: tripId
      in: path
      required: true
      description: Định danh chuyến tàu.
      schema:
        type: string
        example: "SE1-2026"
    BookingId:
      name: bookingId
      in: path
      required: true
      description: Mã vé UUID.
      schema:
        type: string
        format: uuid
        example: "d7a3b8f2-9c1e-4f6a-b2d5-8e3c7a9f1d4b"
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Đưa access token JWT vào header Authorization dưới dạng "Bearer <token>"

  responses:
    GlobalRateLimited:
      description: >-
        Đã vượt global rate limit của server (mặc định 2.000 request mỗi phút trên mỗi IP.
    Unauthorized:
      description: Thiếu Bearer token, token không hợp lệ hoặc token đã hết hạn.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            missingToken:
              value:
                error:
                  code: UNAUTHORIZED
                  message: Bạn cần đăng nhập để thực hiện thao tác này!
            expiredToken:
              value:
                error:
                  code: TOKEN_EXPIRED
                  message: Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại!
            invalidToken:
              value:
                error:
                  code: INVALID_TOKEN
                  message: Token không hợp lệ!
    AuthRateLimited:
      description: Đã vượt giới hạn 20 request mỗi phút trên mỗi IP cho API xác thực.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: TOO_MANY_REQUESTS
              message: Bạn thao tác quá nhanh, vui lòng thử lại sau
    InternalServerError:
      description: Lỗi máy chủ nội bộ.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            error:
              code: INTERNAL_ERROR
              message: Lỗi máy chủ nội bộ

  schemas:

    BookingDetailData:
      type: object
      required:
        - bookingId
        - tripId
        - seatNumber
        - fromIndex
        - toIndex
        - segmentMask
      properties:
        bookingId:
          type: string
          format: uuid
        tripId:
          type: string
        seatNumber:
          type: integer
        fromIndex:
          type: integer
        toIndex:
          type: integer
        segmentMask:
          type: integer
        createdAt:
          type: string
          format: date-time

    BookingDetailResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/BookingDetailData"

    DeleteBookingData:
      type: object
      required:
        - bookingId
        - tripId
        - seatNumber
        - message
      properties:
        bookingId:
          type: string
        tripId:
          type: string
        seatNumber:
          type: integer
        message:
          type: string

    DeleteBookingResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/DeleteBookingData"
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          example: ok

    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Mã lỗi do ứng dụng cung cấp.
        message:
          type: string
          description: Thông báo lỗi bằng tiếng Việt.

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorDetail"

    RegisterRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          description: Email đăng ký. Backend trim và chuyển thành chữ thường.
          example: nguyenvana@gmail.com
        password:
          type: string
          format: password
          description: Mật khẩu dạng văn bản thuần chỉ dùng trong request.
          example: SecurePass123!

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          example: nguyenvana@gmail.com
        password:
          type: string
          format: password
          example: SecurePass123!

    RefreshTokenRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          description: Refresh token nhận được từ API đăng nhập.

    UserData:
      type: object
      required:
        - userId
        - email
      properties:
        userId:
          type: string
          description: MongoDB ObjectId của người dùng.
          example: "66f57871b69f64a132fae201"
        email:
          type: string
          example: nguyenvana@gmail.com

    RegisterResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/UserData"

    TokenPair:
      type: object
      required:
        - accessToken
        - refreshToken
      properties:
        accessToken:
          type: string
          description: JWT access token.
        refreshToken:
          type: string
          description: JWT refresh token.

    LoginResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/TokenPair"

    RefreshResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - accessToken
          properties:
            accessToken:
              type: string
              description: JWT access token mới.

    LogoutResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - message
          properties:
            message:
              type: string

    SeatAvailability:
      type: object
      required:
        - seatNumber
        - available
      properties:
        seatNumber:
          type: integer
          minimum: 1
        available:
          type: boolean
          description: Ghế có thể đặt cho chặng được yêu cầu hay không.

    GetSeatsData:
      type: object
      required:
        - tripId
        - fromIndex
        - toIndex
        - requestedMask
        - seats
      properties:
        tripId:
          type: string
        fromIndex:
          type: integer
        toIndex:
          type: integer
        requestedMask:
          type: integer
        seats:
          type: array
          items:
            $ref: "#/components/schemas/SeatAvailability"

    GetSeatsResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/GetSeatsData"

    CreateBookingRequest:
      type: object
      required:
        - tripId
        - seatNumber
        - fromIndex
        - toIndex
      properties:
        tripId:
          type: string
          minLength: 1
          maxLength: 120
        seatNumber:
          type: integer
          minimum: 1
          maximum: 1000
        fromIndex:
          type: integer
          minimum: 0
          maximum: 3
        toIndex:
          type: integer
          minimum: 1
          maximum: 4
      description: toIndex phải lớn hơn fromIndex.

    CreateBookingData:
      type: object
      required:
        - bookingId
        - tripId
        - seatNumber
        - fromIndex
        - toIndex
        - segmentMask
        - status
      properties:
        bookingId:
          type: string
          format: uuid
          description: Mã vé UUID.
        tripId:
          type: string
        seatNumber:
          type: integer
        fromIndex:
          type: integer
        toIndex:
          type: integer
        segmentMask:
          type: integer
        status:
          type: string
          enum:
            - CONFIRMED

    CreateBookingResponse:
      type: object
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/CreateBookingData"

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: Access token (có giá trị 15 phút)
        refreshToken:
          type: string
          description: Refresh token (có giá trị 7 ngày)
      required:
        - accessToken
        - refreshToken
