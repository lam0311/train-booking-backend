openapi: 3.0.0
info:
  title: Hệ thống Đặt Vé Tàu Hỏa - API Documentation
  description: >-
    Tài liệu API cho hệ thống đặt vé tàu hỏa, hỗ trợ đăng ký/đăng nhập,
    kiểm tra số lượng ghế trống trên các chuyến tàu, đặt vé và hủy vé.
  version: 1.0.0
  contact:
    name: Developer
  license:
    name: MIT

servers:
  - url: http://localhost:5000
    description: Server phát triển cục bộ

# Security: áp dụng toàn cục (Swagger UI sẽ hiển thị nút Authorize)
security:
  - BearerAuth: []

externalDocs:
  description: OpenAPI JSON dành cho OWASP ZAP scan
  url: ./openapi.json

tags:
  - name: Health
    description: Kiểm tra trạng thái sức khỏe server
  - name: Authentication
    description: Đăng ký, đăng nhập, làm mới và đăng xuất tài khoản
  - name: Seats
    description: Tra cứu danh sách ghế và tình trạng chỗ trống theo chuyến
  - name: Bookings
    description: Đặt vé mới, xem chi tiết vé và hủy vé

components:
  parameters:
    AuthorizationHeader:
      in: header
      required: true
      schema:
        type: string
      description: Bearer token nhận được từ đăng nhập, ví dụ "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

  responses:
    Unauthorized:
      description: Chưa đăng nhập hoặc token không hợp lệ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UNAUTHORIZED
              message: "Bạn cần đăng nhập để thực hiện thao tác này!"
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: NOT_FOUND
              message: "Không tìm thấy tài nguyên với mã đã cho"
    UnexpectedError:
      description: Lỗi máy chủ nội bộ
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INTERNAL_ERROR
              message: "Lỗi máy chủ nội bộ"

  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          description: Mã lỗi của ứng dụng
        message:
          type: string
          description: Thông báo lỗi bằng tiếng Việt
      required:
        - code
        - message
      additionalProperties: false

    BookingResponse:
      type: object
      properties:
        bookingId:
          type: string
          description: Mã vé định danh UUID
        tripId:
          type: string
          description: Định danh chuyến tàu
        seatNumber:
          type: integer
          description: Số ghế
        fromIndex:
          type: integer
          description: Chỉ số ga xuất phát
        toIndex:
          type: integer
          description: Chỉ số ga đến
        segmentMask:
          type: integer
          description: Bitmask chặng đường
        status:
          type: string
          enum:
            - CONFIRMED
          description: Trạng thái vé
        createdAt:
          type: string
          format: date-time
          description: Thời gian tạo vé
      required:
        - bookingId
        - tripId
        - seatNumber
        - fromIndex
        - toIndex
        - segmentMask
        - status

    SeatResponse:
      type: object
      properties:
        seatNumber:
          type: integer
        available:
          type: boolean
          description: Ghế có thể đặt được không
      required:
        - seatNumber
        - available

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: Access token (có giá trị 15 phút)
        refreshToken:
          type: string
          description: Refresh token (có giá trị 7 ngày)
      required:
        - accessToken
        - refreshToken

paths:
  /health/live:
    get:
      operationId: health_live
      tags:
        - Health
      summary: Kiểm tra trạng thái hoạt động của server
      description: Endpoint công khai, không yêu cầu xác thực, dùng để kiểm tra server có đang chạy không.
      responses:
        "200":
          description: Server đang hoạt động
          content:
            application/json:
              schema:
                type: object
              example:
                status: ok
        default:
          description: unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/register:
    post:
      operationId: auth_register
      tags:
        - Authentication
      summary: Đăng ký tài khoản mới
      description: Tạo một tài khoản mới bằng email và mật khẩu. Email phải là định dạng hợp lệ.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: Địa chỉ email của người dùng (duy nhất)
                  example: "nguyenvana@gmail.com"
                password:
                  type: string
                  minLength: 6
                  description: Mật khẩu (tối thiểu 6 ký tự)
                  example: "SecurePass123!"
            examples:
              register-success:
                summary: Example request body
                value:
                  email: "nguyenvana@gmail.com"
                  password: "SecurePass123!"
      responses:
        "201":
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      userId:
                        type: string
                      email:
                        type: string
                      createdAt:
                        type: string
                        format: date-time
              example:
                data:
                  userId: "66f57871b69f64a132fae201"
                  email: "nguyenvana@gmail.com"
                  createdAt: "2026-10-03T10:00:00.000Z"
        "400":
          description: Dữ liệu nhập không hợp lệ (email sai định dạng, mật khẩu quá ngắn)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: VALIDATION_ERROR
                message: "Trường email không hợp lệ"
        "500":
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/auth/login:
    post:
      operationId: auth_login
      tags:
        - Authentication
      summary: Đăng nhập để nhận access token và refresh token
      description: Xác thực email và mật khẩu. Khi thành công, trả về accessToken (sống 15 phút) và refreshToken (sống 7 ngày).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  description: Địa chỉ email đã đăng ký
                  example: "nguyenvana@gmail.com"
                password:
                  type: string
                  description: Mật khẩu tương ứng
                  example: "SecurePass123!"
            examples:
              login-success:
                summary: Example request body
                value:
                  email: "nguyenvana@gmail.com"
                  password: "SecurePass123!"
      responses:
        "200":
          description: Đăng nhập thành công, trả về access token và refresh token
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
                      refreshToken:
                        type: string
              example:
                data:
                  accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI2NmY1Nzg3MWI2OWY2NGExMzJmYWUyMDEiLCJlbWFpbCI6Im5ndXllbnZhbmFAZ21haWwuY29tIiwiaWF0IjoxNzI1MzI4ODAwLCJleHAiOjE3MjUzMzQ4MDB9.example-signature"
                  refreshToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh-token-example"
        "400":
          description: Dữ liệu nhập không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: VALIDATION_ERROR
                message: "Trường email không hợp lệ"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/auth/refresh:
    post:
      operationId: auth_refresh
      tags:
        - Authentication
      summary: Làm mới access token
      description: Dùng refresh token hợp lệ để lấy một access token mới. Không yêu cầu Bearer token trong header Authorization; refresh token được gửi trong body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: Refresh token nhận được từ bước đăng nhập
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh-token-example"
      responses:
        "200":
          description: Làm mới token thành công, trả về access token mới
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      accessToken:
                        type: string
              example:
                data:
                  accessToken: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.new-access-token-example"
        "400":
          description: Dữ liệu nhập không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: VALIDATION_ERROR
                message: "Trường refreshToken không hợp lệ"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/auth/logout:
    post:
      operationId: auth_logout
      tags:
        - Authentication
      summary: Đăng xuất khỏi tài khoản
      description: Hủy phiên đăng nhập bằng cách xóa refresh token. Public endpoint, không yêu cầu Bearer token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
                  description: Refresh token cần hủy
                  example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.refresh-token-example"
      responses:
        "200":
          description: Đăng xuất thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      message:
                        type: string
              example:
                data:
                  message: "Đăng xuất thành công"
        "400":
          description: Dữ liệu nhập không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: VALIDATION_ERROR
                message: "Trường refreshToken không hợp lệ"
        "500":
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/trips/{tripId}/seats:
    get:
      operationId: get_seats
      tags:
        - Seats
      summary: Tra cứu danh sách ghế và tình trạng chỗ trống của một chuyến tàu
      description: >-
        Trả về danh sách tất cả ghế trong chuyến, cùng với trạng thái availability
        (có thể đặt được hay chưa) cho chặng từ ga `from` đến ga `to`.
        Không yêu cầu xác thực.
      parameters:
        - name: tripId
          in: path
          required: true
          description: Định danh chuyến tàu
          schema:
            type: string
            example: "SE1-2026"
        - name: from
          in: query
          required: true
          description: >-
            Chỉ số ga xuất phát (từ ga thứ `from` đến ga thứ `to`).
            Nhận giá trị từ 0 đến 3. Mặc định là 0 khi không truyền.
          schema:
            type: integer
            minimum: 0
            maximum: 3
            default: 0
            example: 0
        - name: to
          in: query
          required: true
          description: >-
            Chỉ số ga đến. Nhận giá trị từ 1 đến 4. Mặc định là 4 khi không truyền.
          schema:
            type: integer
            minimum: 1
            maximum: 4
            default: 4
            example: 4
      responses:
        "200":
          description: Truy vấn thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  tripId:
                    type: string
                  fromIndex:
                    type: integer
                  toIndex:
                    type: integer
                  requestedMask:
                    type: integer
                  seats:
                    type: array
                    items:
                      $ref: "#/components/schemas/SeatResponse"
              example:
                tripId: "SE1-2026"
                fromIndex: 0
                toIndex: 4
                requestedMask: 15
                seats:
                  - seatNumber: 1
                    available: true
                  - seatNumber: 2
                    available: false
                  - seatNumber: 3
                    available: true
        "400":
          description: Query params không hợp lệ (from/to không phải số, from >= to)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: VALIDATION_ERROR
                message: "to phải lớn hơn from"
        "500":
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/bookings:
    post:
      operationId: create_booking
      tags:
        - Bookings
      summary: Đặt vé tàu mới
      description: Đặt một vé cho một chuyến tàu, một ghế cụ thể và một chặng đường. Chặng đường được chọn phải chưa bị đặt. Cần Bearer token trong header Authorization.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/AuthorizationHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tripId
                - seatNumber
                - fromIndex
                - toIndex
              properties:
                tripId:
                  type: string
                  description: Định danh chuyến tàu (phải trùng với dữ liệu trong hệ thống)
                  example: "SE1-2026"
                seatNumber:
                  type: integer
                  minimum: 1
                  maximum: 1000
                  description: Số ghế muốn đặt
                  example: 5
                fromIndex:
                  type: integer
                  minimum: 0
                  maximum: 3
                  description: >-
                    Chỉ số ga xuất phát (0..3). Ví dụ: 0 là ga A, 1 là ga B.
                  example: 0
                toIndex:
                  type: integer
                  minimum: 1
                  maximum: 4
                  description: >-
                    Chỉ số ga đến (1..4). Phải lớn hơn fromIndex.
                  example: 2
            examples:
              create-booking-success:
                summary: Example request body
                value:
                  tripId: "SE1-2026"
                  seatNumber: 5
                  fromIndex: 0
                  toIndex: 2
      responses:
        "201":
          description: Đặt vé thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BookingResponse"
              example:
                data:
                  bookingId: "d7a3b8f2-9c1e-4f6a-b2d5-8e3c7a9f1d4b"
                  tripId: "SE1-2026"
                  seatNumber: 5
                  fromIndex: 0
                  toIndex: 2
                  segmentMask: 3
                  status: "CONFIRMED"
        "400":
          description: Dữ liệu nhập không hợp lệ (seatNumber ngoài range, fromIndex >= toIndex)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: VALIDATION_ERROR
                message: "toIndex phải lớn hơn fromIndex"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Ghế đã bị đặt ở chặng đường đã chọn hoặc ghế không tồn tại
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: SEGMENT_CONFLICT
                message: "Ghế số 5 đã có người đặt ở chặng này hoặc không tồn tại!"
        "500":
          $ref: "#/components/responses/UnexpectedError"

  /api/v1/bookings/{bookingId}:
    get:
      operationId: get_booking
      tags:
        - Bookings
      summary: Xem chi tiết vé theo mã vé
      description: >-
        Lấy thông tin chi tiết một vé đã đặt dựa trên mã vé. Chỉ chủ sở hữu vé
        hoặc admin mới xem được. Cần Bearer token trong header Authorization.
      security:
        - BearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          description: Mã vé định danh UUID
          schema:
            type: string
            example: "66f57871b69f64a132fae201"
        - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          description: Truy vấn thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/BookingResponse"
              example:
                data:
                  bookingId: "66f57871b69f64a132fae201"
                  tripId: "SE1-2026"
                  seatNumber: 5
                  fromIndex: 0
                  toIndex: 2
                  segmentMask: 3
                  status: "CONFIRMED"
                  createdAt: "2026-10-03T10:30:00.000Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/UnexpectedError"

    delete:
      operationId: delete_booking
      tags:
        - Bookings
      summary: Hủy vé (nhả chặng ghế)
      description: >-
        Hủy một vé đã đặt và giải phóng các đoạn ghế đã chiếm dụng. Chỉ chủ sở hữu vé
        mới hủy được. Cần Bearer token trong header Authorization.
      security:
        - BearerAuth: []
      parameters:
        - name: bookingId
          in: path
          required: true
          description: Mã vé định danh UUID cần hủy
          schema:
            type: string
            example: "66f57871b69f64a132fae201"
        - $ref: "#/components/parameters/AuthorizationHeader"
      responses:
        "200":
          description: Hủy vé thành công, ghế đã được nhả
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      bookingId:
                        type: string
                      tripId:
                        type: string
                      seatNumber:
                        type: integer
                      message:
                        type: string
              example:
                data:
                  bookingId: "66f57871b69f64a132fae201"
                  tripId: "SE1-2026"
                  seatNumber: 5
                  message: "Hủy vé thành công"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/UnexpectedError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Đưa access token JWT vào header Authorization dưới dạng "Bearer <token>"

  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          description: Mã lỗi của ứng dụng
          example: INTERNAL_ERROR
        message:
          type: string
          description: Thông báo lỗi bằng tiếng Việt
          example: "Lỗi máy chủ nội bộ"

    SuccessResponse:
      type: object
      properties:
        data:
          type: object
          description: Dữ liệu trả về
          example: {}
